<meta name="apple-mobile-web-app-title" content="وايت ماركت"><meta name="theme-color" content="#0f7a4a">
<title>وايت ماركت</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#1a2a22;--mu:#66756c;--pr:#0f7a4a;--pt:#fff;--bd:#dce4de;--dg:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#111a15;--card:#1a2520;--tx:#e8f0ea;--mu:#93a39a;--pr:#34b27a;--pt:#06180f;--bd:#2b3a31;--dg:#e5675a;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",system-ui,sans-serif;font-size:15px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--pr);color:var(--pt)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap}
nav .on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
main{padding:12px;max-width:980px;margin:auto}
button{font:inherit;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer}
button.pr{background:var(--pr);color:var(--pt);border-color:var(--pr)}
button.wa{background:#25a244;color:#fff;border-color:#25a244;width:100%;padding:12px;margin-top:8px}
button:disabled{opacity:.5}
input,select{width:100%;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin:4px 0 10px}
textarea{width:100%;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{display:block;font-size:13px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.card h2{margin:4px 0}.card small,.mu{color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{color:var(--mu);font-weight:normal;font-size:13px}
.bad{color:var(--dg);font-weight:bold}
.pos{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:760px){.pos{grid-template-columns:1.4fr 1fr}}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.pi{display:flex;flex-direction:column;gap:4px;text-align:right}
.ln{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--bd)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:20}
.box{background:var(--card);border-radius:12px;padding:16px;width:100%;max-width:440px;margin-top:20px}
.row{display:flex;gap:8px}.row button{flex:1}
#toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;z-index:30}
#qr{display:flex;justify-content:center;padding:10px;background:#fff;width:fit-content;margin:10px auto}
.pp{position:fixed;left:-9999px;top:0;width:720px;background:#fff;color:#000;padding:20px;direction:rtl}.pp *{color:#000!important;border-color:#bbb!important;background:transparent!important}.pp .fr{border-color:#0f7a4a!important}.pp .keep{background:#0f7a4a!important}.pp .keep *{color:#fff!important}.pp .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media print{body>*:not(#modal){display:none}.ov{position:static;background:none;padding:0}.noprint{display:none}}

async function hp(ph,cc,salt){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+'|'+nph(ph,cc)));return [...new Uint8Array(b)].slice(0,8).map(x=>x.toString(16).padStart(2,'0')).join('')}
